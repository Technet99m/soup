name = "looper"
description = "Backward scavenger: after absorbing parent gift, sweeps 30 cells behind itself collecting residual energy from dead programs, then replicates with LOOP_OPEN/CLOSE. Hardcoded size — easy mutation target on scan distance and direction."
# 30 bytes:
# [0]  SEEK_SELF_START   [1]  TAKE_ENERGY         (parent gift at self.start)
# [2]  LOAD_IMM [3] 30   scan count = own size
# [4]  LOOP_OPEN  [5] MOV_BWD  [6] TAKE_ENERGY  [7] LOOP_CLOSE
#   → sweeps cells [start-1 .. start-30] (behind self; freed memory zone)
# [8]  SEEK_SELF_START   (reset RH for alloc/copy)
# [9]  LOAD_IMM [10] 30  [11] ALLOC  [12] SET_WRITE_HEAD
# [13] SEEK_SELF_START   [14] LOAD_IMM [15] 30
# [16] LOOP_OPEN  [17] COPY  [18] LOOP_CLOSE
# [19] LOAD_IMM [20] 30  [21] COMMIT  [22] SET_WRITE_HEAD
# [23] LOAD_IMM [24] 100  [25] SWAP  [26] GIVE_ENERGY
# [27] LOAD_IMM [28] 30  [29] JMP_BWD  → (29+1)-30=0 ✓
