# [5]  LOAD_IMM           (12)
# [6]  8                       — reg_a = 8 (jump offset)
# [7]  JMP_BWD            (20) — ip_next = (7+1) - 8 = 0  → loop forever
bytes = [35, 11, 12, 255, 9, 12, 8, 20]
