# Soup simulation configuration
# All fields are optional — missing fields use defaults.

# --- Energy decay ---
energy_decay_rate     = 1     # energy subtracted per decay sweep
energy_decay_interval = 100   # ticks between decay sweeps
energy_current        = 17    # cells energy drifts forward per decay sweep

# --- Energy budget ---
total_energy          = 1_000_000  # total energy conserved in the system
initial_energy        = 5_000      # energy each organism starts with
child_energy          = 500        # energy transferred to child on COMMIT

# --- Costs ---
alloc_cost            = 10    # energy cost to allocate memory
commit_cost           = 20     # energy cost to commit (reproduce)
max_program_age       = 20_000 # executed instructions before an organism wears out

# --- Physical throughput ---
# Per-instruction caps keep scheduler turns physically comparable. A value of
# zero disables the corresponding transfers/conversions rather than removing
# the cap. COMBINE_AB counts one A+B pair as one unit of metabolism.
max_resource_flux_per_instruction = 256 # TAKE/EXCRETE units for either chemistry
max_metabolism_per_instruction    = 256 # CONVERT units or COMBINE_AB pairs

# --- Simulation ---
# These five rates initialize startup ancestors. Descendants inherit fixed-point
# copies and can move every rate up or down; later config changes do not overwrite them.
mutation_rate         = 0.005 # replication COPY errors (not WRITE/attacks/work memory)
insertion_rate        = 0.004 # per birth; inserts one random instruction
deletion_rate         = 0.004 # per birth; deletes a short instruction span
duplication_rate      = 0.004 # per birth; copies a short instruction span
strategy_mutation_rate = 0.01 # per birth; mutate one strategy locus by +/- 12.5%
max_genome_length     = 512
child_locality_bias   = 0.92  # most children are allocated beside their parent
tag_mutation_rate     = 0.01  # heritable partner-recognition marker
interaction_radius    = 256   # inclusive circular radius for resource, foreign, and tag seeks
foreign_write_tracking = true # expose predation in the evolution observer
loop_max_depth        = 8
ticks_per_stat_log    = 10_000
# Observer-only ecotype evidence thresholds. These never affect selection.
ecotype_min_persistence_ticks = 10_000
ecotype_min_reproductive_output = 2
ecotype_min_descendant_generations = 2 # matching grandchild required
rng_seed              = 14201
memory_size           = 65536

# --- Organism-independent resource sources ---
# Offsets are relative to a deterministic origin derived from rng_seed. Each
# source emits from the conserved ambient pool on its own cadence and may move
# by velocity cells after every emission.
[[resource_sources]]
kind = "a"
offset = 0
interval = 10
amount = 200
width = 8
velocity = 0

[[resource_sources]]
kind = "b"
offset = 128
interval = 10
amount = 50
width = 8
velocity = -1

[[resource_sources]]
kind = "b"
offset = 16384
interval = 10
amount = 125
width = 8
velocity = 0

[[resource_sources]]
kind = "a"
offset = 32768
interval = 10
amount = 125
width = 8
velocity = 1
